# hvpatch agent configuration. All keys are optional except `repository`.

# Release repository (contains v1/). https://, file:// or an absolute path.
# repository = "https://klp.example.org"

# Release ring of this node: "canary", "early" or "stable".
ring = "stable"

# Trusted manifest signing keys (minisign public keys, *.pub).
# trusted_keys_dir = "/etc/hvpatch/trusted.d"

# Certificate the modules are signed with; needed for Secure Boot (MOK).
# module_cert = "/etc/hvpatch/module-cert.der"

# Seconds to wait for a livepatch transition before backing out.
# Tasks that block get a fake signal every 15 s; keep this well above that.
# transition_timeout = 120

# Seconds to watch the kernel log and taint flags after the transition.
# settle_time = 10

# After a reboot into the same kernel, reload the previously active module
# even if its manifest expired meanwhile (running without it is not safer).
# allow_expired_on_boot = true

# node_exporter textfile collector directory ("" disables).
# textfile_dir = "/var/lib/prometheus/node-exporter"

# Executables run (in name order) after each successful load by `apply` or
# the boot reload, not after `revert`. A non-zero exit reverts the load.
# hooks_dir = "/etc/hvpatch/hooks.d"

# state_dir = "/var/lib/hvpatch"
# http_timeout = 300
# allow_http = false

# Seconds a hook may run before it is killed (and counts as failed).
# hook_timeout = 120

# Seconds the boot reload waits for another hvpatch run (e.g. the timer).
# boot_lock_wait = 300

# Proxmox VE cluster: only one node loads a livepatch at a time, using a
# cluster-wide lock in pmxcfs (/etc/pve/priv/lock). Without quorum nothing
# is loaded. Set to false to let nodes load independently.
# cluster_lock = true

# The timer applies a level only this many hours after it was built (a
# delayed channel). An explicit `hvpatch apply` ignores the delay.
# delay_hours = 0

# The timer never goes beyond this level; an explicit `apply` can.
# pin_level = 3

# Refuse to load when kprobes or BPF programs are attached to a function the
# livepatch replaces. Default: load and warn.
# refuse_on_trace_conflict = false

# Effective kernel version and fixed CVEs for vulnerability scanners:
# <run_dir>/effective_version (e.g. "7.3.4-1-pve+hvpatch.2") and fixed_cves.
# run_dir = "/run/hvpatch"
