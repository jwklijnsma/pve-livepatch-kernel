# pve-livepatch-kernel documentation - built with Zensical (https://zensical.org), same design as shift-mox
#   pip install -r requirements-docs.txt
#   zensical serve            # preview on http://localhost:8000
#   zensical build --strict   # what CI runs

[project]
site_name = "pve-livepatch-kernel"
site_description = "Kernel live patching for Proxmox VE hypervisors: apply kernel security fixes without a reboot, built and signed by GitHub Actions"
site_url = "https://jwklijnsma.github.io/pve-livepatch-kernel/docs/"
repo_url = "https://github.com/jwklijnsma/pve-livepatch-kernel"
repo_name = "jwklijnsma/pve-livepatch-kernel"
edit_uri = "edit/main/docs/"
copyright = "pve-livepatch-kernel - fork of prepaid-host/hvpatch"
nav = [
  { "Home" = "index.md" },
  { "Getting started" = [
    { "Why" = "why.md" },
    { "Quick start" = "quickstart.md" },
    { "Commands" = "commands.md" },
  ] },
  { "Automatic builds" = [
    { "On GitHub Actions" = "automatic-builds.md" },
    { "Self-hosting" = "self-hosting.md" },
    { "APT repository" = "apt-repository.md" },
    { "Toolchains" = "toolchains.md" },
    { "Kernel 7.0" = "kernel-7.0.md" },
  ] },
  { "How it works" = [
    { "Overview" = "how-it-works.md" },
    { "Architecture" = "architecture.md" },
    { "Writing fixes" = "writing-fixes.md" },
  ] },
  { "Security" = [
    { "Threat model" = "threat-model.md" },
    { "Key management" = "key-management.md" },
  ] },
  { "Reference" = [
    { "Limits" = "limits.md" },
    { "Status and roadmap" = "roadmap.md" },
    { "FAQ" = "faq.md" },
    { "Repository layout" = "layout.md" },
    { "Contributing and license" = "contributing.md" },
  ] },
]

[project.theme]
language = "en"
features = [
  "content.action.edit",
  "content.code.annotate",
  "content.code.copy",
  "navigation.footer",
  "navigation.sections",
  "navigation.tabs",
  "navigation.top",
  "search.highlight",
]

[project.theme.icon]
logo = "material/bandage"
repo = "fontawesome/brands/github"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "deep orange"
accent = "deep orange"
toggle.icon = "material/weather-night"
toggle.name = "Dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "deep orange"
accent = "deep orange"
toggle.icon = "material/weather-sunny"
toggle.name = "Light mode"

[project.markdown_extensions]
admonition = {}
attr_list = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.highlight.anchor_linenums = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.snippets = {}
pymdownx.tabbed.alternate_style = true
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
