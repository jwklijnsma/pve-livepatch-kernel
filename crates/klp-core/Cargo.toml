[package]
name = "klp-core"
description = "Shared types and checks for pve-klp: manifest, signatures, policy, ELF inspection"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
# Signing is only needed on the build side. The node agent only verifies.
sign = ["dep:ed25519-dalek", "dep:blake2"]

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
sha2.workspace = true
base64.workspace = true
hex.workspace = true
object.workspace = true
minisign-verify.workspace = true
ed25519-dalek = { workspace = true, optional = true }
blake2 = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true
klp-core = { path = ".", features = ["sign"] }
object = { version = "0.41", default-features = false, features = ["read_core", "elf", "std", "write"] }

[lints]
workspace = true
