name: Bug report
description: Something in the agent or the build tooling does not work
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Security issues must not be reported here. See SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: status
    attributes:
      label: Output of `hvpatch status --json` and `hvpatch check`
      render: json
  - type: input
    id: kernel
    attributes:
      label: Kernel (`uname -r`) and hvpatch version
    validations:
      required: true
