name: Docs

# Builds the Zensical site on every push / PR that touches the docs. It is published
# under /docs/ by livepatch.yml, which owns this repo's GitHub Pages site.
on:
  push:
    branches: [main]
    paths: [docs/**, zensical.toml, requirements-docs.txt, .github/workflows/docs.yml]
  pull_request:
    paths: [docs/**, zensical.toml, requirements-docs.txt, .github/workflows/docs.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - run: pip install -r requirements-docs.txt
      # --strict: fail on warnings such as links to missing pages or anchors
      - run: zensical build --clean --strict
