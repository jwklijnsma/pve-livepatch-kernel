name: release

# Push a tag like v0.1.0 to build the Debian package and the static agent
# binary and attach them, with checksums, to a GitHub release. Tags with a
# suffix (v0.2.0-rc1) are marked pre-release; GitHub's "latest" link, which
# the README's quick start uses, skips those.

on:
  push:
    tags: ["v*"]
  # Dry run from the Actions tab: builds and checks everything, publishes
  # nothing.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deb:
    runs-on: ubuntu-24.04
    container: debian:trixie
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: apt-get update && apt-get install -y build-essential debhelper ca-certificates dpkg-dev rustup
      - name: version matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v="$(dpkg-parsechangelog -S Version | sed 's/-[^-]*$//')"
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "debian/changelog has $v, tag is ${GITHUB_REF_NAME}"; exit 1; }
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - run: PATH="$HOME/.cargo/bin:$PATH" dpkg-buildpackage -us -uc -b -d
      - run: mkdir -p dist && mv ../hvpatch_*.deb dist/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deb
          path: dist/*.deb

  static:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install stable --profile minimal --target x86_64-unknown-linux-musl && rustup default stable
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked -p hvpatch -p hvpatch-tool --target x86_64-unknown-linux-musl
      - run: |
          mkdir -p dist
          cp target/x86_64-unknown-linux-musl/release/hvpatch dist/hvpatch-x86_64-linux-musl
          cp target/x86_64-unknown-linux-musl/release/hvpatch-tool dist/hvpatch-tool-x86_64-linux-musl
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: static
          path: dist/*

  publish:
    needs: [deb, static]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: stable download name for releases/latest/download
        run: cp dist/hvpatch_*_amd64.deb dist/hvpatch_amd64.deb
      - run: cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - name: build provenance attestation
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*
      - name: release notes from CHANGELOG.md
        run: |
          v="${GITHUB_REF_NAME#v}"
          case "$GITHUB_REF" in refs/tags/v*) ;; *) v="$(sed -n 's/^## \[\([0-9][^]]*\)\].*/\1/p' CHANGELOG.md | head -n1)" ;; esac
          awk -v v="$v" '$0 ~ "^## \\[" v "\\]" {on=1; next} on && /^## \[/ {exit} on && /^\[[^]]+\]: http/ {next} on' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "CHANGELOG.md has no section for $v"; exit 1; }
          cat >> notes.md <<NOTES

          ### Install

          \`\`\`bash
          wget https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/hvpatch_amd64.deb
          apt install ./hvpatch_amd64.deb
          hvpatch setup --repository <your repository> --key <manifest key>
          \`\`\`

          ### Verify

          \`\`\`bash
          sha256sum -c SHA256SUMS --ignore-missing
          gh attestation verify hvpatch_amd64.deb --repo ${GITHUB_REPOSITORY}
          \`\`\`
          NOTES
          cat notes.md
      - name: create release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          case "${GITHUB_REF_NAME}" in *-*) flags+=(--prerelease) ;; esac
          gh release create "${GITHUB_REF_NAME}" dist/* --title "hvpatch ${GITHUB_REF_NAME#v}" \
            --notes-file notes.md --verify-tag "${flags[@]}"
