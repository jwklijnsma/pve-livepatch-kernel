name: release

# Push a tag like v0.1.0 to build the Debian package and the static agent
# binary and attach them, with checksums, to a GitHub release. Tags with a
# suffix (v0.2.0-rc1) are marked pre-release; GitHub's "latest" link, which
# the README's quick start uses, skips those.
#
# Fork: a push to main that adds a new version to debian/changelog releases
# that version too (tag v<version>, created here) when the tag does not
# exist yet.

on:
  push:
    tags: ["v*"]
    branches: [main]
    paths: [debian/changelog, .github/workflows/release.yml]
  # Dry run from the Actions tab: builds and checks everything, publishes
  # nothing.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: v
        run: |
          v=$(sed -n '1s/^[^ ]* (\([^)]*\)).*/\1/p' debian/changelog | sed 's/-[^-]*$//')
          release=false
          case "$GITHUB_REF" in
            refs/tags/v*) tag="$GITHUB_REF_NAME"; release=true ;;
            refs/heads/main)
              tag="v$v"
              if [ "$GITHUB_EVENT_NAME" = push ] && ! git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
                release=true
              fi ;;
            *) tag="v$v" ;;
          esac
          echo "version $v, tag $tag, release $release"
          { echo "tag=$tag"; echo "release=$release"; } >> "$GITHUB_OUTPUT"

  deb:
    needs: version
    runs-on: ubuntu-24.04
    container: debian:trixie
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: apt-get update && apt-get install -y build-essential debhelper ca-certificates dpkg-dev rustup
      - name: version matches tag
        if: needs.version.outputs.release == 'true'
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          v="$(dpkg-parsechangelog -S Version | sed 's/-[^-]*$//')"
          [ "v$v" = "$TAG" ] || { echo "debian/changelog has $v, tag is $TAG"; exit 1; }
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - run: PATH="$HOME/.cargo/bin:$PATH" dpkg-buildpackage -us -uc -b -d
      - run: mkdir -p dist && mv ../hvpatch_*.deb dist/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deb
          path: dist/*.deb

  static:
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install stable --profile minimal --target x86_64-unknown-linux-musl && rustup default stable
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked -p hvpatch -p hvpatch-tool --target x86_64-unknown-linux-musl
      - run: |
          mkdir -p dist
          cp target/x86_64-unknown-linux-musl/release/hvpatch dist/hvpatch-x86_64-linux-musl
          cp target/x86_64-unknown-linux-musl/release/hvpatch-tool dist/hvpatch-tool-x86_64-linux-musl
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: static
          path: dist/*

  publish:
    needs: [version, deb, static]
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ needs.version.outputs.tag }}
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: stable download name for releases/latest/download
        run: cp dist/hvpatch_*_amd64.deb dist/hvpatch_amd64.deb
      - name: software bill of materials (CycloneDX, from Cargo.lock)
        uses: anchore/sbom-action@dfcb83b97731532d72be422cbc51ee64adb6fd56 # v0.24.4
        with:
          path: .
          format: cyclonedx-json
          output-file: dist/hvpatch.cdx.json
          upload-artifact: false
          upload-release-assets: false
      - run: cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - name: build provenance attestation
        id: provenance
        if: needs.version.outputs.release == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*
      - name: provenance bundle as a release asset (offline verification)
        if: needs.version.outputs.release == 'true'
        env:
          BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: cp "$BUNDLE" dist/hvpatch.intoto.jsonl
      - name: SBOM attestation for the binaries and the package
        if: needs.version.outputs.release == 'true'
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: |
            dist/hvpatch-x86_64-linux-musl
            dist/hvpatch-tool-x86_64-linux-musl
            dist/hvpatch_*_amd64.deb
          sbom-path: dist/hvpatch.cdx.json
      - name: release notes from CHANGELOG.md
        run: |
          v="${TAG#v}"
          awk -v v="$v" 'index($0, "## [" v "]") == 1 {on=1; next} on && /^## \[/ {exit} on && /^\[[^]]+\]: http/ {next} on' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "CHANGELOG.md has no section for $v"; exit 1; }
          cat >> notes.md <<NOTES

          ### Install

          \`\`\`bash
          wget https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/hvpatch_amd64.deb
          apt install ./hvpatch_amd64.deb
          hvpatch setup --repository <your repository> --key <manifest key>
          \`\`\`

          ### Verify

          \`\`\`bash
          sha256sum -c SHA256SUMS --ignore-missing
          gh attestation verify hvpatch_amd64.deb --repo ${GITHUB_REPOSITORY}
          \`\`\`

          \`hvpatch.cdx.json\` lists every Rust dependency (CycloneDX SBOM).
          \`hvpatch.intoto.jsonl\` is the signed build provenance, for offline
          verification (\`gh attestation verify --bundle hvpatch.intoto.jsonl\`).
          NOTES
          cat notes.md
      - name: create release
        if: needs.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          case "${TAG}" in *-*) flags+=(--prerelease) ;; esac
          # A tag push brings its tag; a version bump on main creates it here.
          case "$GITHUB_REF" in refs/tags/*) flags+=(--verify-tag) ;; *) flags+=(--target "$GITHUB_SHA") ;; esac
          gh release create "${TAG}" dist/* --title "pve-livepatch-kernel (hvpatch) ${TAG#v}" \
            --notes-file notes.md "${flags[@]}"
