name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install stable --profile minimal --component clippy,rustfmt --target x86_64-unknown-linux-musl && rustup default stable
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: static agent binary
        run: cargo build --release --locked -p hvpatch --target x86_64-unknown-linux-musl
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hvpatch-x86_64-linux-musl
          path: target/x86_64-unknown-linux-musl/release/hvpatch

  catalog:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - run: cargo run --locked -q -p hvpatch-tool -- lint --catalog catalog
      - name: fetch the upstream commits named in the catalog
        run: |
          # One diff per commit: in a shallow clone, fetching several
          # commits can turn one into a root commit and break git show.
          mkdir -p upstream
          for c in $(sed -n 's/^upstream_commits:.*\[\(.*\)\].*/\1/p' catalog/*/meta.yaml | tr -d '" ' | tr ',' '\n' | sort -u); do
            for r in torvalds/linux gregkh/linux; do
              curl -fsSL --retry 3 "https://github.com/$r/commit/$c.diff" -o "upstream/$c.diff" && continue 2
            done
            echo "::error::upstream commit $c not found in torvalds/linux or the stable tree"
            exit 1
          done
      - name: compare catalog patches with upstream (git patch-id)
        run: cargo run --locked -q -p hvpatch-tool -- lint --catalog catalog --upstream upstream

  shell:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: shellcheck -x -S warning builder/*.sh
      - run: shellcheck -s sh debian/hvpatch.postinst debian/hvpatch.postrm

  deb:
    runs-on: ubuntu-24.04
    container: debian:trixie
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: apt-get update && apt-get install -y build-essential debhelper ca-certificates rustup
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - run: PATH="$HOME/.cargo/bin:$PATH" dpkg-buildpackage -us -uc -b -d
      - run: mkdir -p dist && mv ../hvpatch_*.deb dist/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hvpatch-deb
          path: dist/*.deb

  # Upgrades must never prompt: unattended-upgrades and Ansible run without
  # a TTY. Take over a node that ran pve-klp (the former name, last release
  # 0.1.6) with setup, keys, hooks, state and the auto timer enabled, then
  # check reinstall, purge and a fresh install.
  deb-upgrade:
    needs: deb
    runs-on: ubuntu-24.04
    container: debian:trixie
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: hvpatch-deb
          path: new
      - run: apt-get update && apt-get install -y ca-certificates curl
      - name: node on pve-klp 0.1.6 after setup
        run: |
          curl -fsSLO https://github.com/prepaid-host/hvpatch/releases/download/v0.1.6/pve-klp_0.1.6-1_amd64.deb
          apt-get install -y ./pve-klp_0.1.6-1_amd64.deb
          pve-klp setup --repository https://klp.example.org --ring canary || true
          printf 'untrusted comment: test\nRWQBAgMEBQYHCAECAwQFBgcIAQIDBAUGBwgBAgMEBQYHCAECAwQFBgc=\n' > /etc/pve-klp/trusted.d/own.pub
          printf '#!/bin/sh\nexit 0\n' > /etc/pve-klp/hooks.d/10-check && chmod 0755 /etc/pve-klp/hooks.d/10-check
          mkdir -p /var/lib/pve-klp
          echo '{"kernels":{"7.3.5-1-pve":{"highest_accepted":3,"desired_level":3,"phase":"active"}}}' > /var/lib/pve-klp/state.json
          mkdir -p /etc/systemd/system/timers.target.wants
          ln -sf /usr/lib/systemd/system/pve-klp-auto.timer /etc/systemd/system/timers.target.wants/pve-klp-auto.timer
      - name: install hvpatch without a TTY takes over the node
        run: |
          apt-get install -y ./new/hvpatch_*_amd64.deb < /dev/null
          dpkg-query -W -f='${Status} ${Version}\n' hvpatch | tee /dev/stderr | grep -q '^install ok installed'
          ! dpkg-query -W -f='${Status}\n' pve-klp 2>/dev/null | grep -q '^install ok installed'
          grep -qx 'ring = "canary"' /etc/hvpatch/hvpatch.toml
          grep -qx 'repository = "https://klp.example.org"' /etc/hvpatch/hvpatch.toml
          ! grep -q 'pve-klp' /etc/hvpatch/hvpatch.toml
          test -f /etc/hvpatch/trusted.d/own.pub
          test -x /etc/hvpatch/hooks.d/10-check
          grep -q '"highest_accepted":3' /var/lib/hvpatch/state.json
          test -L /etc/systemd/system/timers.target.wants/hvpatch-auto.timer
          test ! -e /etc/systemd/system/timers.target.wants/pve-klp-auto.timer
          ! dpkg-query --control-show hvpatch conffiles 2>/dev/null | grep -q hvpatch.toml
          hvpatch --version
      - name: setup again without --ring keeps the ring
        run: |
          hvpatch setup --repository https://klp.example.org || true
          grep -qx 'ring = "canary"' /etc/hvpatch/hvpatch.toml
      - name: reinstall, purge, fresh install
        run: |
          apt-get install -y --reinstall ./new/hvpatch_*_amd64.deb < /dev/null
          grep -qx 'ring = "canary"' /etc/hvpatch/hvpatch.toml
          apt-get purge -y hvpatch
          test ! -e /etc/hvpatch/hvpatch.toml
          rm -rf /etc/pve-klp
          apt-get install -y ./new/hvpatch_*_amd64.deb < /dev/null
          grep -qx 'ring = "stable"' /etc/hvpatch/hvpatch.toml
          hvpatch --version
