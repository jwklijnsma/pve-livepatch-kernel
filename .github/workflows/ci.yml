name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install stable --profile minimal --component clippy,rustfmt --target x86_64-unknown-linux-musl && rustup default stable
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: static agent binary
        run: cargo build --release --locked -p pve-klp --target x86_64-unknown-linux-musl
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pve-klp-x86_64-linux-musl
          path: target/x86_64-unknown-linux-musl/release/pve-klp

  catalog:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - run: cargo run --locked -q -p pve-klp-tool -- lint --catalog catalog

  shell:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: shellcheck -x -S warning builder/*.sh

  deb:
    runs-on: ubuntu-24.04
    container: debian:trixie
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: apt-get update && apt-get install -y build-essential debhelper ca-certificates rustup
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - run: PATH="$HOME/.cargo/bin:$PATH" dpkg-buildpackage -us -uc -b -d
      - run: mkdir -p dist && mv ../pve-klp_*.deb dist/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pve-klp-deb
          path: dist/*.deb

  # Upgrades must never prompt: unattended-upgrades and Ansible run without
  # a TTY. Upgrade a node that ran `setup` on the last conffile release
  # (0.1.3) to this build, then check install, reinstall and purge.
  deb-upgrade:
    needs: deb
    runs-on: ubuntu-24.04
    container: debian:trixie
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pve-klp-deb
          path: new
      - run: apt-get update && apt-get install -y ca-certificates curl
      - name: node on 0.1.3 after setup
        run: |
          curl -fsSLO https://github.com/prepaid-host/pve-klp/releases/download/v0.1.3/pve-klp_0.1.3-1_amd64.deb
          apt-get install -y ./pve-klp_0.1.3-1_amd64.deb
          pve-klp setup --repository https://klp.example.org --ring canary || true
          grep -qx 'ring = "canary"' /etc/pve-klp/pve-klp.toml
      - name: upgrade without a TTY keeps the node's config
        run: |
          apt-get install -y ./new/pve-klp_*_amd64.deb < /dev/null
          dpkg-query -W -f='${Status} ${Version}\n' pve-klp | tee /dev/stderr | grep -q '^install ok installed'
          grep -qx 'ring = "canary"' /etc/pve-klp/pve-klp.toml
          grep -qx 'repository = "https://klp.example.org"' /etc/pve-klp/pve-klp.toml
          ! dpkg-query --control-show pve-klp conffiles 2>/dev/null | grep -q pve-klp.toml
      - name: setup again without --ring keeps the ring
        run: |
          pve-klp setup --repository https://klp.example.org || true
          grep -qx 'ring = "canary"' /etc/pve-klp/pve-klp.toml
      - name: reinstall, purge, fresh install
        run: |
          apt-get install -y --reinstall ./new/pve-klp_*_amd64.deb < /dev/null
          grep -qx 'ring = "canary"' /etc/pve-klp/pve-klp.toml
          apt-get purge -y pve-klp
          test ! -e /etc/pve-klp/pve-klp.toml
          apt-get install -y ./new/pve-klp_*_amd64.deb < /dev/null
          test -f /etc/pve-klp/pve-klp.toml
          pve-klp --version
