name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install bats
        run: sudo apt-get update -qq && sudo apt-get install -y bats rsync

      - name: ShellCheck
        run: shellcheck -S warning pve-livepatch.sh packaging/build-deb.sh ci/build-livepatch.sh

      - name: Run test suite
        run: bats --print-output-on-failure --timing tests/
