name: build live patch

# Builds a live-patch module for a Proxmox VE kernel in GitHub's cloud with the
# kernel's own klp-build, like Ubuntu Pro / RHEL do centrally, so nodes only
# download a small module:
#   Actions → "build live patch" → Run workflow
#   then on the node:  pve-livepatch fetch lp-<name>-<kernel>
# auto-livepatch.yml calls this for every new Proxmox kernel (release lp-auto-<kernel>).
# Modules are signed here with the MODULE_SIGNING_PEM secret (private key +
# certificate, PEM); nodes only download, check and load them. The certificate
# is published as release "signing-cert" for `pve-livepatch mok setup`.
on:
  workflow_dispatch:
    inputs:
      kernel:
        description: "Proxmox kernel (uname -r on the node), e.g. 7.0.14-26-pve"
        required: true
      patch:
        description: "Kernel source patch: URL, or a path in this repo (e.g. patches/examples/proc-cmdline-demo.patch)"
        required: true
      name:
        description: "Patch name: letters, digits, _ (e.g. cve_2026_1234)"
        required: true
      dist:
        description: "Proxmox/Debian release of the node (trixie = PVE 9)"
        default: trixie
  workflow_call:
    inputs:
      kernel: { type: string, required: true }
      patch:  { type: string, required: true }
      name:   { type: string, required: true }
      dist:   { type: string, default: trixie }
      tag:    { type: string, default: "" }
    secrets:
      MODULE_SIGNING_PEM: { required: false }

permissions:
  contents: write

concurrency:
  group: livepatch-${{ inputs.name }}-${{ inputs.kernel }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      KERNEL: ${{ inputs.kernel }}
      PATCH:  ${{ inputs.patch }}
      NAME:   ${{ inputs.name }}
      DIST:   ${{ inputs.dist }}
      TAG_IN: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - name: Validate inputs
        run: |
          [[ $KERNEL =~ ^[0-9]+\.[0-9]+\.[0-9]+-[0-9]+-pve$ ]] || { echo "::error::kernel must look like 7.0.14-26-pve"; exit 1; }
          [[ $NAME =~ ^[A-Za-z0-9_]{1,40}$ ]]                || { echo "::error::name: letters, digits, _ (max 40)"; exit 1; }
          [[ $DIST =~ ^(trixie|bookworm)$ ]]                 || { echo "::error::dist must be trixie or bookworm"; exit 1; }
          tag=${TAG_IN:-lp-${NAME}-${KERNEL}}
          [[ $tag =~ ^lp-[A-Za-z0-9_.-]+$ ]]                 || { echo "::error::invalid tag $tag"; exit 1; }
          echo "TAG=$tag" >> "$GITHUB_ENV"

      - name: Free disk space on the runner
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache \
                      /usr/local/share/boost /usr/local/.ghcup /usr/share/swift || true
          sudo docker image prune -af >/dev/null || true
          df -h / /mnt 2>/dev/null || df -h /
          # build on whichever disk has more room (hosted runners often have a big /mnt)
          root_free=$(df -BG --output=avail / | tail -1 | tr -dc 0-9)
          mnt_free=$(df -BG --output=avail /mnt 2>/dev/null | tail -1 | tr -dc 0-9); mnt_free=${mnt_free:-0}
          if (( mnt_free > root_free )); then
            sudo mkdir -p /mnt/lpbuild && sudo chown "$(id -u)" /mnt/lpbuild
            echo "BUILD_DIR=/mnt/lpbuild" >> "$GITHUB_ENV"
          else
            mkdir -p "$PWD/_build"; echo "BUILD_DIR=$PWD/_build" >> "$GITHUB_ENV"
          fi

      - name: Build in a Debian ${{ inputs.dist }} container
        env:
          MODULE_SIGNING_PEM: ${{ secrets.MODULE_SIGNING_PEM }}
        run: |
          echo "building in $BUILD_DIR"
          docker run --rm -v "$PWD:/w" -v "$BUILD_DIR:/build" -w /w -e PVE_LIVEPATCH_DIR=/build -e MODULE_SIGNING_PEM \
            "debian:${DIST}" bash ci/build-livepatch.sh "$KERNEL" "$PATCH" "$NAME" "$DIST"

      - name: Keep build logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: logs-${{ env.TAG }}
          path: |
            dist/*.log
            dist/PATCHSET
            ${{ env.BUILD_DIR }}/out/**/*.log
          if-no-files-found: ignore

      - name: Publish release ${{ env.TAG }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sudo chown -R "$(id -u)" dist
          assets=()
          for f in dist/livepatch-"${NAME}"-"${KERNEL}".ko dist/"${NAME}".patch dist/build.log dist/PATCHSET dist/module-signing.der dist/SHA256SUMS; do
            [[ -f $f ]] && assets+=("$f")
          done
          if [[ $TAG == lp-auto-* ]]; then
            title="Automatic live patch for ${KERNEL}"
            if [[ -f dist/livepatch-${NAME}-${KERNEL}.ko ]]; then
              body="Cumulative live patch \`${NAME}\` built from \`patches/auto/\` for Proxmox kernel \`${KERNEL}\`."
            else
              body="Nothing to patch: every fix in \`patches/auto/\` is already part of Proxmox kernel \`${KERNEL}\`."
            fi
            run="Nodes with \`pve-livepatch auto enable\` pick this up by themselves (or run \`pve-livepatch auto run\`)."
            # one release per kernel, always holding the current patch set only
            gh release delete "$TAG" --cleanup-tag -y >/dev/null 2>&1 || true
          else
            title="Live patch ${NAME} for ${KERNEL}"
            body="Live patch **${NAME}** for Proxmox kernel \`${KERNEL}\` (Debian ${DIST}), built with the kernel's klp-build."
            run=$(printf '%s\n' '```bash' "pve-livepatch fetch ${TAG}" \
                  "pve-livepatch apply /var/lib/pve-livepatch/out/${KERNEL}/livepatch-${NAME}.ko --persist" '```')
          fi
          if [[ -f dist/module-signing.der ]]; then
            sig='Signed on GitHub with the certificate in release `signing-cert` (enroll it once per node: `pve-livepatch mok setup`).'
          else
            sig='**Unsigned** (no `MODULE_SIGNING_PEM` secret): loads only on nodes with Secure Boot off.'
          fi
          printf '%s\n\n%s\n\n%s\n' "$body" "$sig" "$run" > notes.md
          [[ -f dist/PATCHSET ]] && { echo; echo '```'; cat dist/PATCHSET; echo '```'; } >> notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${assets[@]}" --clobber
          else
            gh release create "$TAG" "${assets[@]}" --target "$GITHUB_SHA" \
              --title "$title" --notes-file notes.md --latest=false
          fi
          gh release view "$TAG" --json url --jq .url

          # the certificate nodes enroll for Secure Boot (pve-livepatch mok setup)
          if [[ -f dist/module-signing.der ]]; then
            if gh release view signing-cert >/dev/null 2>&1; then
              gh release upload signing-cert dist/module-signing.der --clobber
            else
              gh release create signing-cert dist/module-signing.der --target "$GITHUB_SHA" --latest=false \
                --title "Module signing certificate" \
                --notes "Certificate GitHub Actions signs live-patch modules with. On Secure Boot nodes enroll it once: \`pve-livepatch mok setup\` (one reboot)."
            fi
          fi
