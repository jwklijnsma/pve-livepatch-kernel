[workspace]
resolver = "3"
members = ["crates/klp-core", "crates/pve-klp", "crates/pve-klp-tool"]

[workspace.package]
version = "0.1.4"
edition = "2024"
rust-version = "1.88"
license = "GPL-2.0-only"
repository = "https://github.com/prepaid-host/pve-klp"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["serde", "clock", "std"] }
sha2 = "0.11"
base64 = "0.23"
hex = "0.4"
object = { version = "0.41", default-features = false, features = ["read_core", "elf", "std"] }
minisign-verify = "0.3"
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
toml = "1.2"
libc = "0.2"
ureq = { version = "3", default-features = false, features = ["rustls"] }
ed25519-dalek = "3"
blake2 = "0.11"
serde_norway = "0.9"
tempfile = "3"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
# Nested `if let` reads better than let-chains in the checks below.
collapsible_if = "allow"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
